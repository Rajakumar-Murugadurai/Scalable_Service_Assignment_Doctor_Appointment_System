apiVersion: v1
kind: ConfigMap
metadata:
  name: appointment-db-config
data:
  DB_HOST: appointment-postgres
  DB_PORT: "5432"
  DB_NAME: appointmentdb
  DOCTOR_SERVICE_URL: http://doctor-service:8000
---
apiVersion: v1
kind: Secret
metadata:
  name: appointment-db-secret
type: Opaque
stringData:
  DB_USER: postgres
  DB_PASSWORD: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appointment-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: appointment-postgres
  template:
    metadata:
      labels:
        app: appointment-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: appointmentdb
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: appointment-db-secret
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: appointment-db-secret
                  key: DB_PASSWORD
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: appointment-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-postgres
spec:
  selector:
    app: appointment-postgres
  ports:
    - port: 5432
      targetPort: 5432

