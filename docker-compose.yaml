# Local development / testing for BOTH services together.
# In the real submission each service lives in its own Git repo; this compose
# file is only a convenience to run everything on your machine before K8s.
version: "3.9"

services:
  doctor-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: doctordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"

  doctor-service:
    build: ./doctor-service
    environment:
      DB_HOST: doctor-db
      DB_PORT: "5432"
      DB_NAME: doctordb
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "8001:8000"
    depends_on:
      - doctor-db

  appointment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: appointmentdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  appointment-service:
    build: ./appointment-service
    environment:
      DB_HOST: appointment-db
      DB_PORT: "5432"
      DB_NAME: appointmentdb
      DB_USER: postgres
      DB_PASSWORD: postgres
      DOCTOR_SERVICE_URL: http://doctor-service:8000
    ports:
      - "8002:8000"
    depends_on:
      - appointment-db
      - doctor-service

